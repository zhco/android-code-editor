plugins {
    id 'com.android.application'
    id 'kotlin-android'
}

android {
    namespace 'com.marvis.editor'
    compileSdk 34

    defaultConfig {
        applicationId "com.marvis.editor"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    aaptOptions {
        noCompress 'targz', 'tar.gz', 'zip'
    }

    buildFeatures {
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.7.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
    
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    // Code editor
    implementation 'io.github.Rosemoe.sora-editor:editor:0.23.2'
    implementation 'io.github.Rosemoe.sora-editor:language-textmate:0.23.2'
}
